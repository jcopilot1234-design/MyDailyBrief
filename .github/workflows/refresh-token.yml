name: Auto Refresh Meta Token

on:
  workflow_dispatch: # 手動觸發

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exchange for Long-Lived User Token
        id: step1
        run: |
          # 用短期 User Token 換 60 日長期 User Token
          RESPONSE=$(curl -s -G "https://graph.facebook.com/v22.0/oauth/access_token" \
            --data-urlencode "grant_type=fb_exchange_token" \
            --data-urlencode "client_id=${{ secrets.FB_APP_ID }}" \
            --data-urlencode "client_secret=${{ secrets.FB_APP_SECRET }}" \
            --data-urlencode "fb_exchange_token=${{ secrets.FB_USER_TOKEN }}")
          
          NEW_USER_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          
          if [ "$NEW_USER_TOKEN" = "null" ] || [ -z "$NEW_USER_TOKEN" ]; then
            echo "❌ 無法更新 User Token，API 回應："
            echo "$RESPONSE"
            exit 1
          fi
          
          echo "new_user_token=$NEW_USER_TOKEN" >> $GITHUB_OUTPUT

      - name: Get New Long-Lived Page Token
        id: step2
        run: |
          # 直接指定 Thedailynewsbrief 嘅 Page ID 去攞 Token
          PAGE_ID="1425303797332022"
          
          RESPONSE=$(curl -s -G "https://graph.facebook.com/v22.0/${PAGE_ID}" \
            --data-urlencode "fields=access_token" \
            --data-urlencode "access_token=${{ steps.step1.outputs.new_user_token }}")
          
          NEW_PAGE_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          
          if [ "$NEW_PAGE_TOKEN" = "null" ] || [ -z "$NEW_PAGE_TOKEN" ]; then
            echo "❌ 無法取得 Page Token，API 回應："
            echo "$RESPONSE"
            exit 1
          fi
          
          echo "new_page_token=$NEW_PAGE_TOKEN" >> $GITHUB_OUTPUT

      - name: Update GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # 用 GitHub CLI 更新 Secrets
          gh secret set FB_USER_TOKEN -b "${{ steps.step1.outputs.new_user_token }}"
          gh secret set IG_PAGE_ACCESS_TOKEN -b "${{ steps.step2.outputs.new_page_token }}"
          echo "✅ 已經自動更新 GitHub Secrets！"

      - name: Notify Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🔄 系統通知：Meta Token 已經自動續期成功！未來 60 日將繼續正常運作。" \
            --data-urlencode "disable_web_page_preview=true"
