      - name: Check approval status
        id: check
        run: |
          US_APPROVED=$(jq -r '.us_approved' ig-status.json)
          HK_APPROVED=$(jq -r '.hk_approved' ig-status.json)
          
          # 如果係手動觸發或者由 Approval Check 觸發，一律即刻處理
          if [ "$US_APPROVED" = "true" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "market=us" >> $GITHUB_OUTPUT
            echo "✅ 準備發佈美股"
          elif [ "$HK_APPROVED" = "true" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "market=hk" >> $GITHUB_OUTPUT
            echo "✅ 準備發佈港股"
          else
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "⏳ 未批准"
          fi
