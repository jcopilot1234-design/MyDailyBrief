name: Instagram Publish

on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Which market to publish? (us or hk)'
        required: false
        default: 'auto'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check approval status
        id: check
        run: |
          US_APPROVED=$(jq -r '.us_approved' ig-status.json)
          HK_APPROVED=$(jq -r '.hk_approved' ig-status.json)
          
          INPUT_MARKET="${{ github.event.inputs.market }}"
          
          if [ "$INPUT_MARKET" = "us" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "market=us" >> $GITHUB_OUTPUT
          elif [ "$INPUT_MARKET" = "hk" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "market=hk" >> $GITHUB_OUTPUT
          elif [ "$US_APPROVED" = "true" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "market=us" >> $GITHUB_OUTPUT
          elif [ "$HK_APPROVED" = "true" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "market=hk" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: |
          npm install puppeteer
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate Real News Data via DeepSeek
        if: steps.check.outputs.publish == 'true'
        id: generate_news
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          MARKET="${{ steps.check.outputs.market }}"
          if [ "$MARKET" = "us" ]; then
            # 要求 Point 約 40 字，Detail 約 100 字
            PROMPT="請根據今日美股市場狀況，生成 5 則重要財經新聞。必須以嚴格的 JSON 陣列格式輸出，不要包含任何 markdown code block 標記。格式：[{\"point\":\"重點標題（約40字）\",\"detail\":\"詳細解釋（約100字）\"}]"
          else
            PROMPT="請根據今日港股市場狀況，生成 5 則重要財經新聞。必須以嚴格的 JSON 陣列格式輸出，不要包含任何 markdown code block 標記。格式：[{\"point\":\"重點標題（約40字）\",\"detail\":\"詳細解釋（約100字）\"}]"
          fi
          
          PAYLOAD=$(jq -n \
            --arg model "deepseek-chat" \
            --arg content "$PROMPT" \
            '{model: $model, messages: [{role: "user", content: $content}], temperature: 0.7}')
            
          RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
            
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          CLEAN_JSON=$(echo "$SUMMARY" | sed -n '/\[/,/\]/p')
          
          echo "news_json<<EOF" >> $GITHUB_OUTPUT
          echo "$CLEAN_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate IG images
        if: steps.check.outputs.publish == 'true'
        env:
          NEWS_DATA: ${{ steps.generate_news.outputs.news_json }}
          IG_LABEL: ${{ steps.check.outputs.market == 'us' && '美股日報' || '港股日報' }}
          IG_DATE: ${{ github.run_id }}
        run: |
          node scripts/generate-ig-images.js
          ls -la ig-output/

      - name: Commit images to gh-pages
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          mkdir -p /tmp/ig-images
          cp ig-output/summary.png /tmp/ig-images/
          
          git stash --include-untracked
          git fetch origin gh-pages
          git checkout gh-pages
          
          mkdir -p ig-images
          cp /tmp/ig-images/summary.png ig-images/
          
          git add ig-images/
          git commit -m "Add IG image $(date +%Y-%m-%d)" || echo "No changes"
          git push origin gh-pages

      - name: Wait for GitHub Pages
        if: steps.check.outputs.publish == 'true'
        run: sleep 60

      - name: Publish to Instagram
        if: steps.check.outputs.publish == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
          IG_ACCOUNT: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          NEWS_JSON: ${{ steps.generate_news.outputs.news_json }}
        run: |
          IMAGE_URL="https://jcopilot1234-design.github.io/MyDailyBrief/ig-images/summary.png"
          echo "檢查圖片: $IMAGE_URL"
          
          CONTAINER_ID=$(curl -s -X POST \
            "https://graph.facebook.com/v22.0/${IG_ACCOUNT}/media" \
            --data-urlencode "image_url=${IMAGE_URL}" \
            --data-urlencode "access_token=${IG_TOKEN}" \
            | jq -r '.id // "null"')
            
          echo "容器 ID: $CONTAINER_ID"
          
          # 將 Point 同 Detail 組合成 Caption 的詳細解釋
          POINTS=$(echo "$NEWS_JSON" | jq -r 'map("📌 " + .point + "\n" + .detail) | join("\n\n")')
          
          # 加入 TBC Link 同 20 個 Hashtags
          FULL_CAPTION=$(printf "%s\n\n👉 想開始投資美股/港股？點擊主頁連結或使用以下專屬連結開戶，賺取豐富迎新獎賞！\n🔗 TBC (To Be Confirmed)\n\n#美股 #港股 #財經新聞 #AI新聞快訊 #長期投資 #被動收入 #投資理財 #股票投資 #恒生指數 #道瓊斯 #納斯達克 #科技股 #新能源車 #財經分析 #理財規劃 #新手投資 #香港股市 #美股分析 #投資策略 #財富自由\n\n⚠️ 免責聲明：本內容由 AI 自動生成，僅供參考，不構成任何投資建議。投資涉及風險，請自行評估。" "$POINTS")
          
          if [ "$CONTAINER_ID" != "null" ]; then
            echo "等待 15 秒讓 Meta 處理圖片..."
            sleep 15
            
            PUBLISH_RESPONSE=$(curl -s -X POST \
              "https://graph.facebook.com/v22.0/${IG_ACCOUNT}/media_publish" \
              --data-urlencode "creation_id=${CONTAINER_ID}" \
              --data-urlencode "caption=${FULL_CAPTION}" \
              --data-urlencode "access_token=${IG_TOKEN}")
            echo "發佈結果: $PUBLISH_RESPONSE"
          else
            echo "❌ 容器建立失敗，跳過發佈"
          fi

      - name: Reset approval status
        if: steps.check.outputs.publish == 'true'
        run: |
          git checkout main
          MARKET="${{ steps.check.outputs.market }}"
          if [ "$MARKET" = "us" ]; then
            jq '.us_approved = false | .us_approved_date = null' ig-status.json > /tmp/ig-status.json
          else
            jq '.hk_approved = false | .hk_approved_date = null' ig-status.json > /tmp/ig-status.json
          fi
          mv /tmp/ig-status.json ig-status.json
          
          git add ig-status.json
          git commit -m "Reset approval status" || echo "No changes"
          git push origin main

      - name: Notify Telegram
        if: steps.check.outputs.publish == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=✅ 已成功發佈到 Instagram！" \
            --data-urlencode "disable_web_page_preview=true"
