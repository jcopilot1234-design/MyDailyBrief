name: Instagram Publish

on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Which market to publish? (us or hk)'
        required: false
        default: 'auto'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check approval status
        id: check
        run: |
          US_APPROVED=$(jq -r '.us_approved' ig-status.json)
          HK_APPROVED=$(jq -r '.hk_approved' ig-status.json)
          
          # 如果手動指定咗市場，就強制執行
          INPUT_MARKET="${{ github.event.inputs.market }}"
          
          if [ "$INPUT_MARKET" = "us" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "market=us" >> $GITHUB_OUTPUT
            echo "✅ 準備發佈美股（手動指定）"
          elif [ "$INPUT_MARKET" = "hk" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "market=hk" >> $GITHUB_OUTPUT
            echo "✅ 準備發佈港股（手動指定）"
          elif [ "$US_APPROVED" = "true" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "market=us" >> $GITHUB_OUTPUT
            echo "✅ 準備發佈美股（狀態已批准）"
          elif [ "$HK_APPROVED" = "true" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "market=hk" >> $GITHUB_OUTPUT
            echo "✅ 準備發佈港股（狀態已批准）"
          else
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "⏳ 未批准，或者市場狀態唔啱"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: |
          npm install puppeteer
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate Real News Data via DeepSeek
        if: steps.check.outputs.publish == 'true'
        id: generate_news
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          MARKET="${{ steps.check.outputs.market }}"
          
          if [ "$MARKET" = "us" ]; then
            PROMPT="請根據今日美股市場狀況，生成 5 則重要財經新聞摘要。必須以嚴格的 JSON 陣列格式輸出，不要包含任何 markdown code block 標記。格式必須完全如下：[{\"title\":\"標題\",\"highlight\":\"重點數字\",\"content\":\"100字內內容\",\"source\":\"來源\"}]"
          else
            PROMPT="請根據今日港股市場狀況，生成 5 則重要財經新聞摘要。必須以嚴格的 JSON 陣列格式輸出，不要包含任何 markdown code block 標記。格式必須完全如下：[{\"title\":\"標題\",\"highlight\":\"重點數字\",\"content\":\"100字內內容\",\"source\":\"來源\"}]"
          fi
          
          PAYLOAD=$(jq -n \
            --arg model "deepseek-chat" \
            --arg content "$PROMPT" \
            '{model: $model, messages: [{role: "user", content: $content}], temperature: 0.7}')
            
          RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
            
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          
          # 清理機制：只提取 [ 到 ] 之間嘅內容，刪除所有 Markdown 或廢話
          CLEAN_JSON=$(echo "$SUMMARY" | sed -n '/\[/,/\]/p')
          
          echo "news_json<<EOF" >> $GITHUB_OUTPUT
          echo "$CLEAN_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate IG images
        if: steps.check.outputs.publish == 'true'
        env:
          NEWS_DATA: ${{ steps.generate_news.outputs.news_json }}
          IG_LABEL: ${{ steps.check.outputs.market == 'us' && '美股日報' || '港股日報' }}
          IG_DATE: ${{ github.run_id }}
        run: |
          node scripts/generate-ig-images.js
          ls -la ig-output/

      - name: Commit images to gh-pages
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          mkdir -p /tmp/ig-images
          cp ig-output/*.png /tmp/ig-images/
          
          git stash --include-untracked
          git fetch origin gh-pages
          git checkout gh-pages
          
          mkdir -p ig-images
          cp /tmp/ig-images/*.png ig-images/
          
          git add ig-images/
          git commit -m "Add IG images $(date +%Y-%m-%d)" || echo "No changes"
          git push origin gh-pages

      - name: Wait for GitHub Pages
        if: steps.check.outputs.publish == 'true'
        run: sleep 60

      - name: Publish to Instagram Carousel
        if: steps.check.outputs.publish == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
          IG_ACCOUNT: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: |
          CONTAINERS=""
          for i in 1 2 3 4 5; do
            IMAGE_URL="https://jcopilot1234-design.github.io/MyDailyBrief/ig-images/card-${i}.png"
            echo "檢查圖片 $i: $IMAGE_URL"
            
            RESPONSE=$(curl -s -X POST \
              "https://graph.facebook.com/v22.0/${IG_ACCOUNT}/media" \
              --data-urlencode "image_url=${IMAGE_URL}" \
              --data-urlencode "is_carousel_item=true" \
              --data-urlencode "access_token=${IG_TOKEN}")
            
            echo "API 回應: $RESPONSE"
            
            CONTAINER_ID=$(echo "$RESPONSE" | jq -r '.id // "null"')
            CONTAINERS="${CONTAINERS}${CONTAINER_ID},"
            
            sleep 10
          done
          CONTAINERS=${CONTAINERS%,}
          
          CAPTION=$(printf "今日財經重點 📊\n\n#美股 #港股 #財經新聞 #AI新聞快訊 #長期投資")
          
          CAROUSEL_RESPONSE=$(curl -s -X POST \
            "https://graph.facebook.com/v22.0/${IG_ACCOUNT}/media" \
            --data-urlencode "media_type=CAROUSEL" \
            --data-urlencode "children=${CONTAINERS}" \
            --data-urlencode "caption=${CAPTION}" \
            --data-urlencode "access_token=${IG_TOKEN}")
            
          echo "Carousel API 回應: $CAROUSEL_RESPONSE"
          
          CAROUSEL_ID=$(echo "$CAROUSEL_RESPONSE" | jq -r '.id // "null"')
          
          echo "等待 30 秒讓 Meta 處理 Carousel..."
          sleep 30
          
          if [ "$CAROUSEL_ID" != "null" ]; then
            PUBLISH_RESPONSE=$(curl -s -X POST \
              "https://graph.facebook.com/v22.0/${IG_ACCOUNT}/media_publish" \
              --data-urlencode "creation_id=${CAROUSEL_ID}" \
              --data-urlencode "access_token=${IG_TOKEN}")
            echo "發佈結果: $PUBLISH_RESPONSE"
          else
            echo "❌ Carousel 容器建立失敗，跳過發佈"
          fi

      - name: Reset approval status
        if: steps.check.outputs.publish == 'true'
        run: |
          git checkout main
          MARKET="${{ steps.check.outputs.market }}"
          if [ "$MARKET" = "us" ]; then
            jq '.us_approved = false | .us_approved_date = null' ig-status.json > /tmp/ig-status.json
          else
            jq '.hk_approved = false | .hk_approved_date = null' ig-status.json > /tmp/ig-status.json
          fi
          mv /tmp/ig-status.json ig-status.json
          
          git add ig-status.json
          git commit -m "Reset approval status" || echo "No changes"
          git push origin main

      - name: Notify Telegram
        if: steps.check.outputs.publish == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=✅ 已成功發佈到 Instagram！" \
            --data-urlencode "disable_web_page_preview=true"
