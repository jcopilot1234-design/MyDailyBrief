name: HK Market Brief (4:30PM HKT)

on:
  schedule:
    - cron: '30 8 * * *'  # UTC 08:30 = 香港時間 16:30
  workflow_dispatch:

jobs:
  send-hk-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch HK market data
        id: fetch
        run: |
          SYMBOLS="^HSI,^HSCE,0700.HK,9988.HK,3690.HK,1810.HK,BABA,PDD,JD,000001.SS,399001.SZ,GC=F,CL=F,HG=F"
          
          DATA=""
          IFS=',' read -ra SYM_ARRAY <<< "$SYMBOLS"
          for SYM in "${SYM_ARRAY[@]}"; do
            RESULT=$(curl -s "https://query1.finance.yahoo.com/v8/finance/chart/${SYM}?interval=1d&range=2d" \
              -H "User-Agent: Mozilla/5.0")
            
            PRICE=$(echo "$RESULT" | jq -r '.chart.result[0].meta.regularMarketPrice // "N/A"')
            PREV=$(echo "$RESULT" | jq -r '.chart.result[0].meta.chartPreviousClose // "N/A"')
            NAME=$(echo "$RESULT" | jq -r '.chart.result[0].meta.symbol // "N/A"')
            
            if [ "$PRICE" != "N/A" ] && [ "$PREV" != "N/A" ]; then
              CHANGE=$(awk "BEGIN {printf \"%.2f\", (($PRICE - $PREV) / $PREV) * 100}")
              DATA="${DATA}${NAME}: ${PRICE} (${CHANGE}%)\n"
            fi
          done
          
          echo "data<<EOF" >> $GITHUB_OUTPUT
          echo -e "$DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fetch financial news
        id: news
        run: |
          SOURCES="etnet.com.hk|hkej.com|scmp.com|bloomberg.com|reuters.com|aastocks.com"
          
          NEWS=""
          IFS='|' read -ra SRC_ARRAY <<< "$SOURCES"
          for SRC in "${SRC_ARRAY[@]}"; do
            RSS=$(curl -s "https://news.google.com/rss/search?q=site:${SRC}+stock+market&hl=en-US&gl=US&ceid=US:en" \
              -H "User-Agent: Mozilla/5.0")
            TITLES=$(echo "$RSS" | grep -oP '(?<=<title>)[^<]+' | sed 's/ - .*//' | head -3)
            while IFS= read -r TITLE; do
              [ -n "$TITLE" ] && NEWS="${NEWS}• ${TITLE}\n"
            done <<< "$TITLES"
          done
          
          echo "news<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NEWS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fetch AI news
        id: ainews
        run: |
          RSS=$(curl -s "https://news.google.com/rss/search?q=artificial+intelligence+stock+hk&hl=en-US&gl=US&ceid=US:en" \
            -H "User-Agent: Mozilla/5.0")
          TITLES=$(echo "$RSS" | grep -oP '(?<=<title>)[^<]+' | sed 's/ - .*//' | head -10)
          
          echo "ainews<<EOF" >> $GITHUB_OUTPUT
          while IFS= read -r TITLE; do
            [ -n "$TITLE" ] && echo "• ${TITLE}" >> $GITHUB_OUTPUT
          done <<< "$TITLES"
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI summary
        id: ai
        run: |
          PROMPT="以下係香港市場今日收市數據（香港時間下午）：
          
          ${{ steps.fetch.outputs.data }}
          
          今日財經新聞標題：
          ${{ steps.news.outputs.news }}
          
          AI 相關新聞：
          ${{ steps.ainews.outputs.ainews }}
          
          請用繁體中文生成以下內容：
          
          ## 1. 今日最具影響力財經新聞（10 則 bullet point）
          整合新聞標題同數據，列出 10 則最重要嘅財經新聞、政策改變、重要數據。
          
          ## 2. AI 相關新聞（10 則 bullet point）
          列出 10 則 AI 相關新聞，包括相關概念股表現同重要 AI 發展。
          
          ## 3. 今日市場評論
          用一段 100-150 字嘅評論，總結當天整體表現。
          
          ## 4. 穩建長期投資建議
          提供 2-3 點穩建長期投資建議。
          
          用財經新聞報導嘅語氣，簡潔專業。"
          
          PAYLOAD=$(jq -n \
            --arg model "deepseek-chat" \
            --arg content "$PROMPT" \
            '{model: $model, messages: [{role: "user", content: $content}], temperature: 0.7}')
          
          RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "摘要生成失敗"')
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send to Telegram
        run: |
          MESSAGE="📉 港股收市摘要（$(TZ=Asia/Hong_Kong date +%Y-%m-%d) 下午）%0A%0A${{ steps.ai.outputs.summary }}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE"
