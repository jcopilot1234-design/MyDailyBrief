name: HK Market Brief (4PM HKT)

on:
  schedule:
    - cron: '30 8 * * *'  # UTC 08:00 = 香港時間 16:30
  workflow_dispatch:

jobs:
  send-hk-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch HK market data
        id: fetch
        run: |
          SYMBOLS="^HSI,^HSCE,0700.HK,9988.HK,3690.HK,1810.HK,BABA,PDD,JD,000001.SS,399001.SZ,GC=F,CL=F,HG=F"
          
          DATA=""
          IFS=',' read -ra SYM_ARRAY <<< "$SYMBOLS"
          for SYM in "${SYM_ARRAY[@]}"; do
            RESULT=$(curl -s "https://query1.finance.yahoo.com/v8/finance/chart/${SYM}?interval=1d&range=2d" \
              -H "User-Agent: Mozilla/5.0")
            
            PRICE=$(echo "$RESULT" | jq -r '.chart.result[0].meta.regularMarketPrice // "N/A"')
            PREV=$(echo "$RESULT" | jq -r '.chart.result[0].meta.chartPreviousClose // "N/A"')
            NAME=$(echo "$RESULT" | jq -r '.chart.result[0].meta.symbol // "N/A"')
            
            if [ "$PRICE" != "N/A" ] && [ "$PREV" != "N/A" ]; then
              CHANGE=$(awk "BEGIN {printf \"%.2f\", (($PRICE - $PREV) / $PREV) * 100}")
              DATA="${DATA}${NAME}: ${PRICE} (${CHANGE}%)\n"
            fi
          done
          
          echo "data<<EOF" >> $GITHUB_OUTPUT
          echo -e "$DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fetch financial news
        id: news
        run: |
          NEWS=$(curl -s "https://query1.finance.yahoo.com/v1/finance/search?q=hong%20kong%20stock%20market&newsCount=8" \
            -H "User-Agent: Mozilla/5.0" \
            | jq -r '.news[] | "• " + .title' | head -8)
          
          echo "news<<EOF" >> $GITHUB_OUTPUT
          echo "$NEWS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI summary
        id: ai
        run: |
          PROMPT="以下係香港市場今日收市數據（香港時間下午）：
          
          ${{ steps.fetch.outputs.data }}
          
          最新財經新聞標題：
          ${{ steps.news.outputs.news }}
          
          請用繁體中文寫一段 200 字左右嘅摘要，講下：1) 恒生指數同國企指數表現 2) 主要港股（騰訊、阿里、美團、小米）走勢 3) 中概股（阿里、拼多多、京東）4) A 股（上證、深證）5) 商品市場（黃金、原油、銅）6) 結合新聞標題，講下今日香港市場發生咩事。用財經新聞報導嘅語氣，簡潔專業。"
          
          PAYLOAD=$(jq -n \
            --arg model "deepseek-chat" \
            --arg content "$PROMPT" \
            '{model: $model, messages: [{role: "user", content: $content}], temperature: 0.7}')
          
          RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "摘要生成失敗"')
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send to Telegram
        run: |
          MESSAGE="📉 港股收市摘要（$(TZ=Asia/Hong_Kong date +%Y-%m-%d) 下午）%0A%0A${{ steps.ai.outputs.summary }}%0A%0A📰 財經新聞：%0A${{ steps.news.outputs.news }}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE"
