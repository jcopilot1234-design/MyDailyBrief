name: Instagram Approval Check

on:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分鐘檢查一次
  workflow_dispatch:

jobs:
  check-approval:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check Telegram for OK
        id: check
        run: |
          RESPONSE=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getUpdates")
          
          if echo "$RESPONSE" | grep -qi '"text":"ok"'; then
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "✅ 收到批准回覆"
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "⏳ 未收到批准回覆"
          fi

      - name: Update ig-status.json
        if: steps.check.outputs.approved == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # Debug：顯示當前目錄同檔案列表
          echo "=== 當前目錄 ==="
          pwd
          echo "=== 檔案列表 ==="
          ls -la
          
          # 如果真係搵唔到，自動建立一個
          if [ ! -f "ig-status.json" ]; then
            echo "❌ 搵唔到 ig-status.json，自動建立一個..."
            echo '{"us_approved": false, "us_approved_date": null, "hk_approved": false, "hk_approved_date": null}' > ig-status.json
          fi
          
          TODAY=$(TZ=Asia/Hong_Kong date +%Y-%m-%d)
          HOUR=$(TZ=Asia/Hong_Kong date +%H)
          
          if [ "$HOUR" -lt "12" ]; then
            jq --arg date "$TODAY" '.us_approved = true | .us_approved_date = $date' ig-status.json > /tmp/ig-status.json
          else
            jq --arg date "$TODAY" '.hk_approved = true | .hk_approved_date = $date' ig-status.json > /tmp/ig-status.json
          fi
          mv /tmp/ig-status.json ig-status.json
          
          git add ig-status.json
          git commit -m "Approved market for $TODAY" || echo "No changes"
          git push
          
          echo "✅ 已記錄批准狀態"

      - name: Notify Telegram
        if: steps.check.outputs.approved == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=✅ 已收到批准！將於指定時間自動發佈到 Instagram。" \
            --data-urlencode "disable_web_page_preview=true"
