name: Instagram Approval Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-approval:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check Telegram for OK
        id: check
        run: |
          RESPONSE=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getUpdates")
          if echo "$RESPONSE" | grep -qi '"text":"ok"'; then
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "approved=false" >> $GITHUB_OUTPUT
          fi

      - name: Update ig-status.json
        if: steps.check.outputs.approved == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          TODAY=$(TZ=Asia/Hong_Kong date +%Y-%m-%d)
          HOUR=$(TZ=Asia/Hong_Kong date +%H)
          
          if [ "$HOUR" -lt "12" ]; then
            jq --arg date "$TODAY" '.us_approved = true | .us_approved_date = $date' ig-status.json > /tmp/ig-status.json
          else
            jq --arg date "$TODAY" '.hk_approved = true | .hk_approved_date = $date' ig-status.json > /tmp/ig-status.json
          fi
          mv /tmp/ig-status.json ig-status.json
          
          git add ig-status.json
          git commit -m "Approved market for $TODAY" || echo "No changes"
          git push
