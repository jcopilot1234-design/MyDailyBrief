name: Instagram Approval Check

on:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分鐘檢查一次
  workflow_dispatch:

jobs:
  check-approval:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check Telegram for OK
        id: check
        run: |
          RESPONSE=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getUpdates")
          
          if echo "$RESPONSE" | grep -qi '"text":"ok"'; then
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "✅ 收到批准回覆"
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "⏳ 未收到批准回覆"
          fi

      - name: Update ig-status.json
        if: steps.check.outputs.approved == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          TODAY=$(TZ=Asia/Hong_Kong date +%Y-%m-%d)
          HOUR=$(TZ=Asia/Hong_Kong date +%H)
          
          if [ "$HOUR" -lt "12" ]; then
            jq --arg date "$TODAY" '.us_approved = true | .us_approved_date = $date' ig-status.json > /tmp/ig-status.json
          else
            jq --arg date "$TODAY" '.hk_approved = true | .hk_approved_date = $date' ig-status.json > /tmp/ig-status.json
          fi
          mv /tmp/ig-status.json ig-status.json
          
          git add ig-status.json
          git commit -m "Approved market for $TODAY" || echo "No changes"
          git push
          
          echo "✅ 已記錄批准狀態"

      - name: Trigger Instagram Publish
        if: steps.check.outputs.approved == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/jcopilot1234-design/MyDailyBrief/actions/workflows/ig-publish.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "✅ 已觸發 Instagram Publish"

      - name: Notify Telegram
        if: steps.check.outputs.approved == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=✅ 已收到批准！正在立即處理並發佈到 Instagram..." \
            --data-urlencode "disable_web_page_preview=true"
