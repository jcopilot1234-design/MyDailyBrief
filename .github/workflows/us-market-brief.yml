name: US Market Brief (8AM HKT)

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = 香港時間 08:00
  workflow_dispatch:

jobs:
  send-us-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch US market data
        id: fetch
        run: |
          SYMBOLS="^DJI,^GSPC,^IXIC,AAPL,MSFT,NVDA,GOOGL,TSLA,META,GC=F,CL=F,HG=F,^VIX,^TNX,DXY,BTC-USD,ETH-USD"
          
          DATA=""
          IFS=',' read -ra SYM_ARRAY <<< "$SYMBOLS"
          for SYM in "${SYM_ARRAY[@]}"; do
            RESULT=$(curl -s "https://query1.finance.yahoo.com/v8/finance/chart/${SYM}?interval=1d&range=2d" \
              -H "User-Agent: Mozilla/5.0")
            
            PRICE=$(echo "$RESULT" | jq -r '.chart.result[0].meta.regularMarketPrice // "N/A"')
            PREV=$(echo "$RESULT" | jq -r '.chart.result[0].meta.chartPreviousClose // "N/A"')
            NAME=$(echo "$RESULT" | jq -r '.chart.result[0].meta.symbol // "N/A"')
            
            if [ "$PRICE" != "N/A" ] && [ "$PREV" != "N/A" ]; then
              CHANGE=$(awk "BEGIN {printf \"%.2f\", (($PRICE - $PREV) / $PREV) * 100}")
              DATA="${DATA}${NAME}: ${PRICE} (${CHANGE}%)\n"
            fi
          done
          
          echo "data<<EOF" >> $GITHUB_OUTPUT
          echo -e "$DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fetch financial news with URLs
        id: news
        run: |
          SOURCES="wsj.com|bloomberg.com|reuters.com|cnbc.com|morningstar.com|marketwatch.com"
          
          NEWS=""
          IFS='|' read -ra SRC_ARRAY <<< "$SOURCES"
          for SRC in "${SRC_ARRAY[@]}"; do
            RSS=$(curl -s "https://news.google.com/rss/search?q=site:${SRC}+stock+market&hl=en-US&gl=US&ceid=US:en" \
              -H "User-Agent: Mozilla/5.0")
            
            ITEMS=$(echo "$RSS" | grep -oP '<item>.*?</item>' | head -2)
            while IFS= read -r ITEM; do
              TITLE=$(echo "$ITEM" | grep -oP '(?<=<title>)[^<]+' | sed 's/ - .*//')
              LINK=$(echo "$ITEM" | grep -oP '(?<=<link>)[^<]+')
              SOURCE_NAME=$(echo "$ITEM" | grep -oP '(?<=<source url="[^"]*">)[^<]+' | head -1)
              [ -z "$SOURCE_NAME" ] && SOURCE_NAME=$(echo "$SRC" | cut -d'.' -f1 | tr '[:lower:]' '[:upper:]')
              [ -n "$TITLE" ] && [ -n "$LINK" ] && NEWS="${NEWS}• ${TITLE}"$'\n'"來源: ${SOURCE_NAME}"$'\n'
            done <<< "$ITEMS"
          done
          
          echo "news<<EOF" >> $GITHUB_OUTPUT
          echo "$NEWS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fetch AI news with URLs
        id: ainews
        run: |
          RSS=$(curl -s "https://news.google.com/rss/search?q=artificial+intelligence+stock&hl=en-US&gl=US&ceid=US:en" \
            -H "User-Agent: Mozilla/5.0")
          
          AINEWS=""
          ITEMS=$(echo "$RSS" | grep -oP '<item>.*?</item>' | head -8)
          while IFS= read -r ITEM; do
            TITLE=$(echo "$ITEM" | grep -oP '(?<=<title>)[^<]+' | sed 's/ - .*//')
            LINK=$(echo "$ITEM" | grep -oP '(?<=<link>)[^<]+')
            SOURCE_NAME=$(echo "$ITEM" | grep -oP '(?<=<source url="[^"]*">)[^<]+' | head -1)
            [ -z "$SOURCE_NAME" ] && SOURCE_NAME="News"
            [ -n "$TITLE" ] && [ -n "$LINK" ] && AINEWS="${AINEWS}• ${TITLE}"$'\n'"來源: ${SOURCE_NAME}"$'\n'
          done <<< "$ITEMS"
          
          echo "ainews<<EOF" >> $GITHUB_OUTPUT
          echo "$AINEWS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI summary (Part 1 - News)
        id: ai1
        run: |
          cat > /tmp/prompt1.txt << 'PROMPT_EOF'
          以下係美股昨晚收市數據（香港時間今早）：

          ${{ steps.fetch.outputs.data }}

          今日財經新聞：
          ${{ steps.news.outputs.news }}

          請用繁體中文列出 8 則今日最具影響力嘅財經新聞、政策改變、重要數據。每則格式：
          • 標題
          來源: XXX

          只輸出 8 則，唔好加額外解釋。唔好用 Markdown 格式。
          PROMPT_EOF

          PAYLOAD=$(jq -n \
            --arg model "deepseek-chat" \
            --rawfile content /tmp/prompt1.txt \
            '{model: $model, messages: [{role: "user", content: $content}], temperature: 0.7}')
          
          RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "摘要生成失敗"')
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI summary (Part 2 - AI News)
        id: ai2
        run: |
          cat > /tmp/prompt2.txt << 'PROMPT_EOF'
          AI 相關新聞：
          ${{ steps.ainews.outputs.ainews }}

          請用繁體中文列出 8 則 AI 相關新聞，包括相關概念股表現同重要 AI 發展。每則格式：
          • 標題
          來源: XXX

          只輸出 8 則，唔好加額外解釋。唔好用 Markdown 格式。
          PROMPT_EOF

          PAYLOAD=$(jq -n \
            --arg model "deepseek-chat" \
            --rawfile content /tmp/prompt2.txt \
            '{model: $model, messages: [{role: "user", content: $content}], temperature: 0.7}')
          
          RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "摘要生成失敗"')
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI summary (Part 3 - Commentary)
        id: ai3
        run: |
          cat > /tmp/prompt3.txt << 'PROMPT_EOF'
          以下係美股昨晚收市數據（香港時間今早）：

          ${{ steps.fetch.outputs.data }}

          請用繁體中文生成：

          今日市場評論：
          用一段 100-150 字嘅評論，總結當天整體表現。

          穩建長期投資建議：
          提供 2-3 點穩建長期投資建議。

          唔好用 Markdown 格式，只用純文字。
          PROMPT_EOF

          PAYLOAD=$(jq -n \
            --arg model "deepseek-chat" \
            --rawfile content /tmp/prompt3.txt \
            '{model: $model, messages: [{role: "user", content: $content}], temperature: 0.7}')
          
          RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "摘要生成失敗"')
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Part 1 to Telegram
        run: |
          DATE=$(TZ=Asia/Hong_Kong date +%Y-%m-%d)
          cat > /tmp/msg1.txt << MSG_EOF
          📈 美股收市摘要（${DATE} 早上）

          【財經新聞】
          ${{ steps.ai1.outputs.summary }}
          MSG_EOF
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text@/tmp/msg1.txt"

      - name: Send Part 2 to Telegram
        run: |
          cat > /tmp/msg2.txt << 'MSG_EOF'
          【AI 相關新聞】
          MSG_EOF
          
          echo "${{ steps.ai2.outputs.summary }}" >> /tmp/msg2.txt
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text@/tmp/msg2.txt"

      - name: Send Part 3 to Telegram
        run: |
          cat > /tmp/msg3.txt << 'MSG_EOF'
          【市場評論 + 投資建議】
          MSG_EOF
          
          echo "${{ steps.ai3.outputs.summary }}" >> /tmp/msg3.txt
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text@/tmp/msg3.txt"
