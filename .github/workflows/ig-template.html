<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Noto Sans CJK TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1f3c 100%);
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }
  .bg-grid {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(rgba(100, 150, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(100, 150, 255, 0.05) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .glow-top {
    position: absolute; top: -200px; left: 50%; transform: translateX(-50%);
    width: 800px; height: 400px;
    background: radial-gradient(ellipse, rgba(255, 200, 80, 0.15) 0%, transparent 70%);
  }
  .container {
    position: relative; z-index: 10;
    padding: 70px 60px; height: 100%;
    display: flex; flex-direction: column;
  }
  .top-row {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px;
  }
  .label {
    padding: 12px 28px; background: rgba(255, 200, 80, 0.15); border: 2px solid rgba(255, 200, 80, 0.6); border-radius: 30px;
    font-size: 28px; font-weight: 600; color: #ffc850; letter-spacing: 2px;
  }
  .brand { font-size: 30px; font-weight: 700; text-align: right; }
  .brand-sub { font-size: 20px; color: #8899bb; margin-top: 4px; letter-spacing: 3px; }
  
  .main-title { font-size: 72px; font-weight: 900; color: #ffffff; margin-bottom: 60px; line-height: 1.1; }
  
  .news-list {
    display: flex; flex-direction: column; gap: 40px; flex-grow: 1;
  }
  .news-item {
    display: flex; align-items: flex-start; gap: 25px;
    background: rgba(255, 255, 255, 0.05); padding: 35px 30px; border-radius: 15px; border-left: 8px solid #ffc850;
  }
  .number {
    font-size: 64px; font-weight: 900; color: #ffc850; line-height: 0.9;
  }
  .headline {
    font-size: 48px; font-weight: 700; color: #ffffff; line-height: 1.3;
  }
  
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 30px; border-top: 1px solid rgba(100, 150, 255, 0.2); font-size: 24px; color: #8899bb;
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-top"></div>
  
  <div class="container">
    <div class="top-row">
      <div class="label">{{LABEL}}</div>
      <div>
        <div class="brand">AI 日報</div>
        <div class="brand-sub">DAILY BRIEF</div>
      </div>
    </div>
    
    <div class="main-title">今日市場焦點速覽</div>
    
    <div class="news-list">
      <div class="news-item"><div class="number">1</div><div class="headline">{{HEADLINE_1}}</div></div>
      <div class="news-item"><div class="number">2</div><div class="headline">{{HEADLINE_2}}</div></div>
      <div class="news-item"><div class="number">3</div><div class="headline">{{HEADLINE_3}}</div></div>
      <div class="news-item"><div class="number">4</div><div class="headline">{{HEADLINE_4}}</div></div>
      <div class="news-item"><div class="number">5</div><div class="headline">{{HEADLINE_5}}</div></div>
    </div>
    
    <div class="footer">
      <div>來源：各大財經媒體</div>
      <div>{{DATE}}</div>
    </div>
  </div>
</body>
</html>
